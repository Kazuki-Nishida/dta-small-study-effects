# Runs the test suite (pytest: smoke tests, refits of both reviews against results/applications.json,
# re-analysis of stored simulation replicates) on every push and pull request.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements.txt, requirements-lock.txt]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest -q
