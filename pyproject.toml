[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsroc"
version = "1.0.2"
description = "Small-study effects on the hierarchical summary ROC curve: latent accuracy and threshold trends in meta-analysis of diagnostic test accuracy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuta Nonomiya" },
  { name = "Kazuki Nishida", email = "kazuki.nishida1988@gmail.com" },
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Kazuki-Nishida/dta-small-study-effects"
Preprint = "https://arxiv.org/abs/2609.38297"

[tool.setuptools]
packages = ["hsroc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests import the package from the repository root, so a plain `pytest -q` works after
# `pip install -r requirements.txt` as well as after `pip install -e .`
pythonpath = ["."]
